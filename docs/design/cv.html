			body {
				background: var(--bg-surface-alt);
			}
			.toolbar {
				display: flex;
				justify-content: space-between;
				align-items: end;
				gap: 24px;
				flex-wrap: wrap;
				padding: 24px 0 32px;
			}
			.toolbar h1 {
				font-size: 32px;
				letter-spacing: -0.5px;
			}
			.seg {
				display: inline-flex;
				gap: 4px;
				padding: 6px;
				border-radius: 999px;
				background: var(--bg-surface);
				border: 1.5px solid var(--border-default);
			}
			.seg button {
				border: 0;
				background: none;
				padding: 6px 12px;
				border-radius: 999px;
				cursor: pointer;
				color: var(--text-default);
			}
			.seg button[aria-pressed='true'] {
				background: var(--brand-primary);
				color: var(--brand-on-primary);
			}
			.draft {
				color: var(--text-muted);
				font-size: 14px;
			}

			/* The sheet is always printed in light colours, whatever the site theme. */
			.sheet {
				--ink: #2a1b2e;
				--ink-muted: #6e5a6b;
				--accent: #b4235a;
				--rule: #f2dde5;
				width: 794px;
				max-width: 100%;
				min-height: 1123px;
				margin: 0 auto;
				background: #fff;
				color: var(--ink);
				padding: 48px 56px;
				box-shadow: 0 16px 40px rgba(42, 27, 46, 0.12);
				border-radius: 4px;
				display: grid;
				gap: 18px;
				align-content: start;
				font-size: 10.5px;
				line-height: 1.45;
			}
			.sheet h2 {
				font: 600 30px/1.1 var(--font-display);
				letter-spacing: -0.5px;
			}
			.sheet .role {
				color: var(--accent);
				font: 700 13px var(--font-body);
				margin-top: 4px;
			}
			.sheet header {
				display: flex;
				justify-content: space-between;
				align-items: end;
				gap: 16px;
			}
			.sheet .contact {
				text-align: right;
				color: var(--ink-muted);
				font-size: 10px;
				display: grid;
				gap: 2px;
			}
			.sheet hr {
				border: 0;
				border-top: 1px solid var(--rule);
				margin: 0;
				width: 100%;
			}
			.sheet h3 {
				font: 500 10px var(--font-pixel);
				letter-spacing: 0.5px;
				text-transform: uppercase;
				color: var(--accent);
				margin-bottom: 8px;
			}
			.sheet .job {
				display: grid;
				grid-template-columns: 110px 1fr;
				gap: 16px;
				margin-bottom: 8px;
			}
			.sheet .job .when {
				font-weight: 700;
				color: var(--ink-muted);
				font-size: 9.5px;
			}
			.sheet .job strong {
				font-size: 11px;
				display: block;
			}
			.sheet .job .where {
				color: var(--ink-muted);
				font-size: 9.5px;
			}
			.sheet .cols {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 32px;
			}
			.sheet .cols section {
				margin-bottom: 14px;
			}
			.sheet ul {
				margin: 0;
				padding: 0;
				list-style: none;
				display: grid;
				gap: 4px;
			}
			.note {
				text-align: center;
				color: var(--text-muted);
				padding: 24px 0 0;
				font-weight: 700;
				font-size: 14px;
			}

			@page {
				size: A4;
				margin: 0;
			}
			@media print {
				body {
					background: #fff;
				}
				.site-lights,
				.site-nav,
				.toolbar,
				.note,
				.site-footer,
				.toast {
					display: none !important;
				}
				main.wrap {
					padding: 0;
					max-width: none;
				}
				.sheet {
					box-shadow: none;
					border-radius: 0;
					width: 210mm;
					min-height: 297mm;
				}
			}
			@media (max-width: 860px) {
				.sheet {
					padding: 32px 24px;
				}
				.sheet .cols,
				.sheet header {
					grid-template-columns: 1fr;
					display: grid;
				}
				.sheet .contact {
					text-align: left;
				}
			}
